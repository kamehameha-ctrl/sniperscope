services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sniperscope-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/.cache:/app/backend/.cache
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sniperscope-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
